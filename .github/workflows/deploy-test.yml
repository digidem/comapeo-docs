name: Deploy Test

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch name for deployment (default: test)"
        required: false
        default: "test"
        type: string

jobs:
  deploy-test:
    name: Deploy Test to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout content files from content branch
        run: |
          set -e  # Exit on error

          echo "📥 Fetching content from content branch..."
          git fetch origin content

          echo "📂 Checking out content files..."
          git checkout origin/content -- docs/ i18n/ static/images/

          # The checkout above overlays i18n/ from the content branch,
          # which does not carry this repo's hand-maintained theme
          # translation files (docusaurus-theme-classic/*) — those live
          # only on main. Restore them from main so the theme chrome
          # translations this repo owns actually reach the test deployment
          # instead of silently falling back to whatever (or nothing) the
          # content branch has for those paths.
          git ls-files -z 'i18n/*/docusaurus-theme-classic/*' \
            | xargs -0 -r git checkout HEAD --

          # code.json also carries Notion-generated, content-only
          # translation keys that live only on the content branch. A blind
          # `checkout HEAD` here would silently drop those on every build.
          # Merge instead: keep content-only keys, let HEAD win any key
          # this repo also defines.
          #
          # `jq -s` slurps every JSON document across BOTH input files into
          # one flat array and blindly indexes [0]/[1] — it does not verify
          # each file actually contributed exactly one object. An empty or
          # `null` content file silently falls back to HEAD alone; a content
          # file with two concatenated JSON documents silently drops HEAD
          # entirely. Validate each side is exactly one JSON object before
          # merging so malformed input fails the step instead of shipping a
          # silently wrong catalog.
          validate_single_json_object() {
            local file="$1" label="$2" count
            count=$(jq -s 'length' "$file" 2>/dev/null) || { echo "::error::$label: not valid JSON" >&2; return 1; }
            if [ "$count" != "1" ]; then
              echo "::error::$label: expected exactly 1 JSON document, found $count" >&2
              return 1
            fi
            jq -e 'type == "object"' "$file" >/dev/null 2>&1 || { echo "::error::$label: root value is not a JSON object" >&2; return 1; }
          }

          git ls-files -z 'i18n/*/code.json' | while IFS= read -r -d '' f; do
            head_tmp=$(mktemp)
            git show "HEAD:$f" > "$head_tmp"
            validate_single_json_object "$f" "$f (content overlay)"
            validate_single_json_object "$head_tmp" "HEAD:$f"
            jq -s '.[0] + .[1]' "$f" "$head_tmp" > "$f.tmp"
            mv "$f.tmp" "$f"
            rm -f "$head_tmp"
          done

          # Validate content exists
          echo "🔍 Validating content..."

          # Count markdown files across all languages
          # Guard against missing directories to avoid find failures
          # Support both .md and .mdx files (Docusaurus accepts both)
          if [ -d docs ]; then
            DOCS_COUNT=$(find docs \( -name "*.md" -o -name "*.mdx" \) -type f 2>/dev/null | wc -l)
          else
            DOCS_COUNT=0
          fi

          if [ -d i18n ]; then
            I18N_COUNT=$(find i18n \( -name "*.md" -o -name "*.mdx" \) -type f 2>/dev/null | wc -l)
          else
            I18N_COUNT=0
          fi

          TOTAL_CONTENT=$((DOCS_COUNT + I18N_COUNT))

          if [ "$TOTAL_CONTENT" -eq 0 ]; then
            echo "❌ Error: No documentation content found"
            echo "   Expected: At least one .md or .mdx file in docs/ or i18n/ directories"
            echo "   Found: 0 files"
            echo "Cannot proceed with build - documentation content is required"
            exit 1
          fi

          # Warn if default locale (English) has no content
          if [ "$DOCS_COUNT" -eq 0 ]; then
            echo "⚠️  WARNING: No English content in docs/ directory"
            echo "   Docusaurus build may fail if default locale has no content"
          fi

          if [ ! -d "static/images" ] || [ -z "$(ls -A static/images 2>/dev/null)" ]; then
            echo "⚠️  Warning: static/images/ directory is empty or missing"
            echo "Build will proceed but images may be unavailable"
          fi

          echo "✅ Content validation successful"
          echo "📊 Content statistics:"
          echo "  - English docs: $DOCS_COUNT"
          echo "  - Localized docs: $I18N_COUNT"
          echo "  - Total docs: $TOTAL_CONTENT"
          find static/images -type f 2>/dev/null | wc -l | xargs echo "  - Images:"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        run: bun run build

      - name: Deploy to Cloudflare Pages (Test)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name comapeo-docs --branch ${{ inputs.branch_name }} --commit-dirty=true

      - name: Deployment summary
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          echo "🧪 **Test Deployment Complete!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Documentation built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Test URL: https://${BRANCH_NAME}.comapeo-docs.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This is a test deployment for verification purposes only." >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*Test deploy*: ${{ job.status }} (branch: ${{ inputs.branch_name }})"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Test deploy*: ${{ job.status }}\nBranch: `${{ inputs.branch_name }}`"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Preview URL: https://${{ inputs.branch_name }}.comapeo-docs.pages.dev"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Trigger: <https://github.com/${{ github.triggering_actor }}|${{ github.triggering_actor }}>\nDispatch source: ${{ github.event_name }}"
