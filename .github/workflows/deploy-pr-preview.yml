name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"

# Prevent concurrent deployments for the same PR
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy PR Preview to Cloudflare Pages
    runs-on: ubuntu-latest
    # Skip if PR is from a fork (security: forks don't have access to secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code (PR branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Checkout content from content branch
        run: |
          set -e

          # Content comes from the content branch, pushed by the canonical
          # generator in ../comapeo-content-pipeline/. No Notion fetching here.
          git fetch origin content || {
            echo "::error::cannot fetch origin/content — run sync in ../comapeo-content-pipeline/"
            exit 1
          }

          git checkout origin/content -- docs/ i18n/ static/images/ || {
            echo "::error::content checkout failed — content branch malformed"
            exit 1
          }

          # Validate: at least one md/mdx file across docs/ and i18n/
          if [ -d docs ]; then
            DOCS_COUNT=$(find docs \( -name "*.md" -o -name "*.mdx" \) -type f 2>/dev/null | wc -l)
          else
            DOCS_COUNT=0
          fi

          if [ -d i18n ]; then
            I18N_COUNT=$(find i18n \( -name "*.md" -o -name "*.mdx" \) -type f 2>/dev/null | wc -l)
          else
            I18N_COUNT=0
          fi

          TOTAL_CONTENT=$((DOCS_COUNT + I18N_COUNT))

          if [ "$TOTAL_CONTENT" -eq 0 ]; then
            echo "❌ ERROR: Content checkout produced 0 markdown files"
            echo "   Expected: at least one .md or .mdx in docs/ or i18n/"
            echo "   Fix: run the sync in ../comapeo-content-pipeline/ (its push updates content)"
            exit 1
          fi

          if [ "$DOCS_COUNT" -eq 0 ]; then
            echo "⚠️  WARNING: docs/ is empty — Docusaurus build may fail (default locale is English)"
          fi

          if [ "$I18N_COUNT" -eq 0 ]; then
            echo "⚠️  Note: i18n/ is empty (no localized content)"
          fi

          if [ ! -d "static/images" ] || [ -z "$(ls -A static/images 2>/dev/null)" ]; then
            echo "⚠️  Warning: static/images/ directory is empty or missing"
          fi

          echo "✅ Content validated: $DOCS_COUNT English docs, $I18N_COUNT localized docs"
          find static/images -type f 2>/dev/null | wc -l | xargs echo "  - Images:"

      - name: Restore hand-maintained i18n files
        # The content-provisioning step above overlaid i18n/ from the
        # content branch, which does not carry this repo's hand-maintained UI
        # and theme translation files (code.json and docusaurus-theme-classic/*) —
        # those live solely on main. Restore them from HEAD so this repo's
        # curated translations take precedence.
        run: |
          set -e
          git ls-files -z 'i18n/*/docusaurus-theme-classic/*' 'i18n/*/code.json' \
            | xargs -0 -r git checkout HEAD --

      - name: Build documentation
        # IS_PRODUCTION not set - generates noindex meta tags and disallow robots.txt
        run: bun run build

      - name: Deploy to Cloudflare Pages (PR Preview)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name comapeo-docs --branch pr-${{ github.event.pull_request.number }} --commit-dirty=true

      - name: Comment PR with preview URL
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.DEPLOYMENT_ALIAS_URL || `https://pr-${prNumber}.comapeo-docs.pages.dev`;
            const contentInfo = '📦 **Content:** from `content` branch (same source as staging/production)';

            const commentBody = `## 🚀 Preview Deployment

            Your documentation preview is ready!

            **Preview URL:** ${previewUrl}

            ${contentInfo}

            This preview will update automatically when you push new commits to this PR.

            ---

            <sub>Built with commit ${context.payload.pull_request.head.sha.substring(0, 7)}</sub>`;

            // Check if comment already exists
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Deployment')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

      - name: Deployment summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "🚀 **PR Preview Deployment Complete!**"
            echo ""
            echo "- ✅ Documentation built successfully"
            echo "- ✅ Deployed to Cloudflare Pages"
            echo "- 🌐 Preview URL: ${PREVIEW_URL:-https://pr-${{ github.event.pull_request.number }}.comapeo-docs.pages.dev}"
            echo ""
            echo "- 📦 Content from content branch"
            echo ""
            echo "This preview will update automatically with new commits."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*PR Preview Deploy*: ${{ job.status }} for PR #${{ github.event.pull_request.number }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*PR Preview Deploy*: ${{ job.status }}\nPR: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Preview URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || format('https://pr-{0}.comapeo-docs.pages.dev', github.event.pull_request.number) }}\nCommit: `${{ github.event.pull_request.head.sha }}`"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Content: content branch\nTrigger: <https://github.com/${{ github.triggering_actor }}|${{ github.triggering_actor }}>"
